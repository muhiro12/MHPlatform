name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check release eligibility
        id: eligibility
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "Manual releases only publish from main."
            exit 0
          fi

          echo "should_release=true" >>"$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.eligibility.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Refresh tags
        if: steps.eligibility.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

      - name: Install SwiftLint
        if: steps.eligibility.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint version
            exit 0
          fi

          brew install swiftlint

      - name: Verify repository
        if: steps.eligibility.outputs.should_release == 'true'
        shell: bash
        run: bash ci_scripts/tasks/verify.sh

      - name: Calculate next release tag
        if: steps.eligibility.outputs.should_release == 'true'
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          existing_release_tag=$(
            git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+$' | head -n 1 || true
          )

          if [[ -n "$existing_release_tag" ]]; then
            echo "already_released=true" >>"$GITHUB_OUTPUT"
            echo "existing_tag=$existing_release_tag" >>"$GITHUB_OUTPUT"
            echo "Commit ${GITHUB_SHA} already has release tag ${existing_release_tag}."
            exit 0
          fi

          latest_release_tag=$(
            git tag --list '[0-9]*.[0-9]*' --sort=version:refname \
              | grep -E '^[0-9]+\.[0-9]+$' \
              | tail -n 1 || true
          )

          if [[ -z "$latest_release_tag" ]]; then
            next_release_tag="1.0"
          else
            IFS='.' read -r major_version minor_version <<<"$latest_release_tag"
            next_release_tag="${major_version}.$((minor_version + 1))"
          fi

          echo "already_released=false" >>"$GITHUB_OUTPUT"
          echo "next_tag=$next_release_tag" >>"$GITHUB_OUTPUT"
          echo "Publishing release tag ${next_release_tag} for ${GITHUB_SHA}."

      - name: Create GitHub release
        if: |
          steps.eligibility.outputs.should_release == 'true' &&
          steps.release_tag.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.release_tag.outputs.next_tag }}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
