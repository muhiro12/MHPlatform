name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          latest_release_tag=$(
            git tag --list '[0-9]*.[0-9]*' --sort=version:refname \
              | grep -E '^[0-9]+\.[0-9]+$' \
              | tail -n 1 || true
          )

          if [[ -z "$latest_release_tag" ]]; then
            next_release_tag="1.0"
          else
            IFS='.' read -r major_version minor_version <<<"$latest_release_tag"
            next_release_tag="${major_version}.$((minor_version + 1))"
          fi

          echo "next_tag=$next_release_tag" >>"$GITHUB_OUTPUT"
          echo "Publishing release tag ${next_release_tag} for ${GITHUB_SHA}."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.release_tag.outputs.next_tag }}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
