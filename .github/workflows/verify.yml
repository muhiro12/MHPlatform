name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SwiftLint
        shell: bash
        run: |
          set -euo pipefail

          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint version
            exit 0
          fi

          brew install swiftlint

      - name: Verify repository
        shell: bash
        run: bash ci_scripts/tasks/verify.sh
